<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calendar</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <p class="app-name">My Calendar</p>
      </header>
      <main>
        <h1 id="calendar-title">Годовой календарь <span id="calendar-year"></span></h1>
        <section
          class="calendar-panel"
          aria-labelledby="calendar-title"
        >
          <div class="calendar-scroll" tabindex="0">
            <div class="year-columns">
              <section class="month-column" aria-labelledby="month-january">
                <h2 class="month-name" id="month-january">Январь</h2>
              </section>
              <section class="month-column" aria-labelledby="month-february">
                <h2 class="month-name" id="month-february">Февраль</h2>
              </section>
              <section class="month-column" aria-labelledby="month-march">
                <h2 class="month-name" id="month-march">Март</h2>
              </section>
              <section class="month-column" aria-labelledby="month-april">
                <h2 class="month-name" id="month-april">Апрель</h2>
              </section>
              <section class="month-column" aria-labelledby="month-may">
                <h2 class="month-name" id="month-may">Май</h2>
              </section>
              <section class="month-column" aria-labelledby="month-june">
                <h2 class="month-name" id="month-june">Июнь</h2>
              </section>
              <section class="month-column" aria-labelledby="month-july">
                <h2 class="month-name" id="month-july">Июль</h2>
              </section>
              <section class="month-column" aria-labelledby="month-august">
                <h2 class="month-name" id="month-august">Август</h2>
              </section>
              <section class="month-column" aria-labelledby="month-september">
                <h2 class="month-name" id="month-september">Сентябрь</h2>
              </section>
              <section class="month-column" aria-labelledby="month-october">
                <h2 class="month-name" id="month-october">Октябрь</h2>
              </section>
              <section class="month-column" aria-labelledby="month-november">
                <h2 class="month-name" id="month-november">Ноябрь</h2>
              </section>
              <section class="month-column" aria-labelledby="month-december">
                <h2 class="month-name" id="month-december">Декабрь</h2>
              </section>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="day-backdrop" id="day-events-dialog" role="dialog" aria-modal="true" aria-labelledby="day-events-title" hidden>
      <section class="day-dialog">
        <header class="day-dialog-header">
          <h2 id="day-events-title">События дня</h2>
          <button class="settings-close" type="button" data-close-dialog aria-label="Закрыть список событий">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" /></svg>
          </button>
        </header>
        <p class="day-dialog-help" id="day-events-date"></p>
        <div class="day-event-list" id="day-event-list"></div>
        <footer class="day-dialog-footer">
          <button class="day-secondary" type="button" data-close-dialog>Готово</button>
          <button class="day-primary" type="button" id="create-event-from-list">＋ Создать событие</button>
        </footer>
      </section>
    </div>
    <div class="day-backdrop" id="yearly-event-dialog" role="dialog" aria-modal="true" aria-labelledby="yearly-event-title" aria-describedby="yearly-event-help" hidden>
      <section class="day-dialog">
        <header class="day-dialog-header">
          <h2 id="yearly-event-title">Новое событие</h2>
          <button class="settings-close" type="button" data-close-dialog aria-label="Закрыть форму">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" /></svg>
          </button>
        </header>
        <p class="day-dialog-help" id="yearly-event-help">Событие хранится только до перезагрузки страницы.</p>
        <form class="yearly-form" id="yearly-event-form">
          <p class="yearly-fixed-date" id="yearly-event-date"></p>
          <label class="yearly-field" for="yearly-event-name">Название
            <input id="yearly-event-name" name="title" type="text" required maxlength="60" />
          </label>
          <label class="yearly-field" for="yearly-event-colour">Цвет
            <select id="yearly-event-colour" name="colour">
              <option value="study">Синий</option>
              <option value="work">Зелёный</option>
              <option value="project">Жёлтый</option>
              <option value="personal">Розовый</option>
              <option value="finance">Бирюзовый</option>
            </select>
          </label>
          <label class="yearly-field" for="yearly-event-description">Описание
            <textarea id="yearly-event-description" name="description" maxlength="240" placeholder="Необязательно"></textarea>
          </label>
          <footer class="day-dialog-footer">
            <button class="day-secondary" type="button" data-back-to-list hidden>← К списку</button>
            <button class="day-secondary" type="button" data-close-dialog>Отмена</button>
            <button class="day-primary" type="submit">Создать событие</button>
          </footer>
        </form>
      </section>
    </div>
    <div class="day-backdrop" id="event-card-dialog" role="dialog" aria-modal="true" aria-labelledby="event-card-title" hidden>
      <section class="day-dialog event-card-dialog">
        <header class="day-dialog-header">
          <div class="event-card-heading">
            <button class="event-card-back" type="button" data-back-to-list hidden>← К списку</button>
            <h2 id="event-card-title">Событие</h2>
          </div>
          <button class="settings-close" type="button" data-close-dialog aria-label="Закрыть карточку события">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" /></svg>
          </button>
        </header>
        <p class="day-dialog-help" id="event-card-date"></p>
        <dl class="event-card-details">
          <div class="event-card-detail"><dt>Календарь</dt><dd>Годовой</dd></div>
          <div class="event-card-detail"><dt>Цвет</dt><dd id="event-card-colour"></dd></div>
          <div class="event-card-detail"><dt>Описание</dt><dd id="event-card-description"></dd></div>
        </dl>
      </section>
    </div>
  </body>
</html>
